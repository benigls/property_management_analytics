version: 2
models:
- name: base_operation__budget
  description: One row per valid budget record.
  columns:
  - name: budget_id
    data_tests:
    - unique
    description: The business identifier for the related budget.
  - name: property_id
    description: '{{ doc(''property_id'') }}'
  - name: budget_month
    description: The calculated budget month for the represented grain.
  - name: account_code
    description: '{{ doc(''account_code'') }}'
  - name: account_name
    description: The calculated account name for the represented grain.
  - name: account_type
    description: '{{ doc(''account_type'') }}'
  - name: budget_amount
    description: The calculated budget amount for the represented grain.
  - name: source_system
    description: '{{ doc(''source_system'') }}'
  - name: source_record_id
    description: '{{ doc(''source_record_id'') }}'
  - name: source_loaded_at
    description: '{{ doc(''source_loaded_at'') }}'
- name: base_operation__charge
  description: One row per source-quality-approved charge record; charge identifiers are not assumed unique because the source can contain duplicate rows.
