name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PMA_WAREHOUSE_PATH: data/ci/warehouse-${{ github.run_id }}-${{ github.run_attempt }}.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: mkdir -p data/ci
      - run: uv sync --all-groups --locked
      - run: uv run dbt deps --project-dir analytics --profiles-dir analytics --target ci
      - run: uv run ruff check src tests apps
      - run: uv run sqlfluff lint analytics/models
      - run: >-
          uv run dbt parse --project-dir analytics --profiles-dir analytics --target ci
          --vars '{"as_of_date":"2026-06-30"}'
      - run: uv run pma-generate --seed 20260828 --as-of 2026-06-30
      - run: >-
          uv run dbt build --project-dir analytics --profiles-dir analytics --target ci
          --vars '{"as_of_date":"2026-06-30"}'
      - run: >-
          uv run dbt docs generate --project-dir analytics --profiles-dir analytics --target ci
          --vars '{"as_of_date":"2026-06-30"}'
      - run: uv run pytest
      - run: uv run pma-validate-determinism --as-of 2026-06-30
